name: E2E smoke test

# Manual trigger (workflow_dispatch) until a test Supabase project is configured.
# Once set up, uncomment the `pull_request` trigger to run on every PR.

on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Demo-path smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed test database
        # Requires E2E_DATABASE_URL (a test-only Supabase) — falls back to dev DB
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: npm run db:push && npm run db:seed

      - name: Run smoke tests
        env:
          # Test login is gated by both env vars
          ENABLE_TEST_LOGIN: '1'
          NODE_ENV: 'test'
          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
