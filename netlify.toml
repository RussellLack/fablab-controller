# Netlify build config for the Fablab Controller.
# Place this at the repo root that Netlify watches (i.e. inside `app/`
# if you connect Netlify to the `app/` subdirectory of the repo).

[build]
  # Next.js build. The @netlify/plugin-nextjs handles RSC, route handlers,
  # server actions, and middleware automatically.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # React 19 RC has loose peer-dep ranges. legacy-peer-deps avoids
  # warnings becoming errors during install.
  NPM_FLAGS = "--legacy-peer-deps"
  # Skip Next telemetry in CI builds
  NEXT_TELEMETRY_DISABLED = "1"

# Auto-detected, but pin to be explicit
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Bundle server actions and route handlers as compact esbuild functions
  node_bundler = "esbuild"

  # Bundle the postgres client and drizzle in functions so they work cold
  external_node_modules = ["postgres"]

# ── REDIRECTS ───────────────────────────────────────────
# www.controller.fablabdesign.com → controller.fablabdesign.com (301)
#
# Note: this rule only fires once the www subdomain actually resolves
# to Netlify. To complete the wiring:
#   1. Netlify dashboard → Domain management → Add domain alias
#      `www.controller.fablabdesign.com`.
#   2. At your DNS provider, add a CNAME record:
#        Name:  www
#        Type:  CNAME
#        Value: <your-site>.netlify.app
#   3. Wait for Let's Encrypt to provision the www cert (a few minutes).
# After those, https://www.controller.fablabdesign.com/foo will 301 to
# https://controller.fablabdesign.com/foo via this rule.
[[redirects]]
  from = "https://www.controller.fablabdesign.com/*"
  to = "https://controller.fablabdesign.com/:splat"
  status = 301
  force = true

# ── HEADERS ─────────────────────────────────────────────
# These reach static assets under /_next/static/* but NOT the Next.js
# function responses (HTML pages). Those headers are set in
# next.config.mjs's headers() — see the comment there. We keep both
# layers as belt-and-braces; duplicate headers are harmless.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── DEPLOY CONTEXTS ─────────────────────────────────────
# Production deploys (from main branch)
[context.production]
  command = "npm run build"

# Deploy previews (per-PR)
[context.deploy-preview]
  command = "npm run build"

# Branch deploys (any other branch)
[context.branch-deploy]
  command = "npm run build"
